<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式数据看板 | HTML+CSS+原生JS</title>
    <style>
        :root {
            --bg-page: #f4f7fa;
            --bg-card: #ffffff;
            --text-main: #222831;
            --text-secondary: #666e79;
            --border-color: #e5e7eb;
            --accent: #3b82f6;
        }
        [data-theme="dark"] {
            --bg-page: #111827;
            --bg-card: #1f2937;
            --text-main: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #374151;
            --accent: #60a5fa;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }
        .page-wrap {
            display: grid;
            min-height: 100vh;
        }
        /* 桌面端 ≥1200px：侧边栏 + 主内容 */
        @media (min-width: 1200px) {
            .page-wrap {
                grid-template-columns: 240px 1fr;
            }
        }
        /* 侧边栏 */
        aside.sidebar {
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 24px;
        }
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
        }
        .sidebar-nav a.active {
            background-color: var(--accent);
            color: white;
        }
        main {
            padding: 24px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap:16px;
        }
        button.theme-toggle {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        svg.icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        /* 卡片容器 grid auto-fit minmax */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        section.dashboard-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .card-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }
        .card-desc {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <aside class="sidebar">
            <h2>数据看板</h2>
            <nav class="sidebar-nav">
                <a href="#" class="active">概览</a>
                <a href="#">订单</a>
                <a href="#">用户</a>
                <a href="#">营收</a>
                <a href="#">设置</a>
            </nav>
        </aside>
        <main>
            <div class="header-bar">
                <h1>业务数据概览</h1>
                <button class="theme-toggle" id="themeBtn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                    切换深色模式
                </button>
            </div>
            <div class="card-container" id="cardWrap">
                <!-- JS渲染卡片 -->
            </div>
        </main>
    </div>

    <script>
        // 6条数据数组，JS渲染卡片
        const dashboardData = [
            { title: "总用户数", value: "12846", desc: "较上周 +12.3%", icon: "user" },
            { title: "今日访问", value: "3692", desc: "较上周 -2.1%", icon: "visit" },
            { title: "成交订单", value: "842", desc: "较上周 +8.7%", icon: "order" },
            { title: "总收入", value: "24680", desc: "单位：元，+15.4%", icon: "money" },
            { title: "转化率", value: "3.26", desc: "单位：%", icon: "rate" },
            { title: "在线人数", value: "176", desc: "实时在线", icon: "online" }
        ];
        const cardWrap = document.getElementById("cardWrap");
        // 渲染函数
        function renderCards(list) {
            cardWrap.innerHTML = "";
            list.forEach(item => {
                const section = document.createElement("section");
                section.className = "dashboard-card";
                section.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">${item.title}</div>
                        <svg class="icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                        </svg>
                    </div>
                    <div class="card-value">${item.value}</div>
                    <div class="card-desc">${item.desc}</div>
                `;
                cardWrap.appendChild(section);
            })
        }
        renderCards(dashboardData);

        // 深浅主题切换
        const themeBtn = document.getElementById("themeBtn");
        const htmlRoot = document.documentElement;
        themeBtn.addEventListener("click", () => {
            const now = htmlRoot.getAttribute("data-theme");
            if (now === "light") {
                htmlRoot.setAttribute("data-theme", "dark");
                themeBtn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM5.64 6.64a1 1 0 011.42 0l1.4 1.4a1 1 0 11-1.42 1.42l-1.4-1.4a1 1 0 010-1.42zm9.9 9.9a1 1 0 011.42 0l1.4 1.4a1 1 0 11-1.42 1.42l-1.4-1.4a1 1 0 010-1.42zM3 13a1 1 0 01-1-1v-2a1 1 0 112 0v2a1 1 0 01-1 1zm18 0a1 1 0 01-1-1v-2a1 1 0 112 0v2a1 1 0 01-1 1zM5.64 17.36a1 1 0 010-1.42l1.4-1.4a1 1 0 111.42 1.42l-1.4 1.4a1 1 0 01-1.42 0zm9.9-9.9a1 1 0 010-1.42l1.4-1.4a1 1 0 111.42 1.42l-1.4 1.4a1 1 0 01-1.42 0z"/>
                    </svg>
                    切换浅色模式
                `;
            } else {
                htmlRoot.setAttribute("data-theme", "light");
                themeBtn.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                    切换深色模式
                `;
            }
        })
    </script>
</body>
</html>
